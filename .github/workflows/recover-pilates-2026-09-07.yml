name: Recover deleted Pilates 2026-09-07

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
      BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Check protected configuration
        shell: bash
        run: |
          test -n "$SUPABASE_DB_URL"
          test -n "$RCLONE_CONFIG_B64"
          test -n "$BACKUP_ENCRYPTION_PASSWORD"

      - name: Install recovery tools
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://downloads.rclone.org/v1.75.0/rclone-v1.75.0-linux-amd64.zip \
            --output rclone.zip
          echo "aa2804e08f48250e71009c727124b6341cd0288465804a9a09d14663cabafbaa  rclone.zip" | sha256sum --check
          unzip -q rclone.zip
          sudo install -m 0755 rclone-v1.75.0-linux-amd64/rclone /usr/local/bin/rclone
          python -m pip install --disable-pip-version-check "psycopg[binary]==3.2.10"

      - name: Download and decrypt the pre-deletion backup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/rclone" recovered
          printf '%s' "$RCLONE_CONFIG_B64" | base64 --decode > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"
          BACKUP_FILE="$(rclone lsf trainings-backup-drive: --files-only \
            --include 'trainings-backup-2026-09-07-*.tar.gz.enc' | sort | tail -n 1)"
          test -n "$BACKUP_FILE"
          rclone copyto "trainings-backup-drive:$BACKUP_FILE" backup.tar.gz.enc
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -pass env:BACKUP_ENCRYPTION_PASSWORD \
            -in backup.tar.gz.enc -out backup.tar.gz
          tar -xzf backup.tar.gz -C recovered

      - name: Restore only the deleted active training
        shell: bash
        run: python scripts/recover_deleted_training.py recovered/backup/data.sql

      - name: Remove local sensitive files
        if: always()
        shell: bash
        run: |
          rm -rf recovered "$HOME/.config/rclone/rclone.conf" \
            rclone.zip rclone-v1.75.0-linux-amd64 backup.tar.gz backup.tar.gz.enc

